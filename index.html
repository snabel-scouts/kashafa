<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f6f8">
<title>نظام نقاط الكشافة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  /* brand — scout identity */
  --green:#2f5d3f;          /* deep olive scout green (primary) */
  --green-deep:#22452f;     /* darker green for headers */
  --green-light:#3d7350;
  --green-soft:#e7efe8;      /* pale green tint */
  --crimson:#a8302f;         /* logo red (accent, sparingly) */
  --crimson-soft:#f3e2e1;
  --gold:#b8862f;            /* gold accent */
  --gold-light:#d4a94a;
  --gold-soft:#f6edd6;
  /* neutrals — warm cream, not cold grey */
  --bg:#f3f0e7;             /* parchment/cream background */
  --surface:#fffdf8;        /* warm off-white cards */
  --line:#e6e0d1;
  --line-strong:#d8d0bd;
  --ink:#26302a;            /* dark green-grey text */
  --ink-soft:#5e6b60;
  --ink-faint:#9aa294;
  --danger:#a8302f;
  --ok:#2f7d4f;
  --radius:18px;
  --radius-sm:12px;
  --shadow:0 1px 2px rgba(40,50,35,.05), 0 8px 22px rgba(40,55,35,.07);
  --shadow-lift:0 2px 4px rgba(40,50,35,.06), 0 16px 38px rgba(40,55,35,.12);
}
html.dark{
  --green:#5aa677; --green-deep:#1a3324; --green-light:#6db88a; --green-soft:#233d2d;
  --crimson:#d97a78; --crimson-soft:#3a2321;
  --gold:#d4a94a; --gold-light:#e0bd6a; --gold-soft:#3a3320;
  --bg:#12160f; --surface:#1c2118; --line:#2d3427; --line-strong:#3c4534;
  --ink:#eef0e8; --ink-soft:#aab09f; --ink-faint:#6f7663;
  --danger:#d97a78; --ok:#5aa677;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.4);
  --shadow-lift:0 2px 4px rgba(0,0,0,.4), 0 16px 38px rgba(0,0,0,.55);
}
/* dark-mode surface fixes for hardcoded colors */
html.dark .list-row{background:#232a1d;}
html.dark .list-row:hover{background:#2a3223;}
html.dark .rank-row.rank-top{background:linear-gradient(90deg,#232a1d,#2c2a1c);}
html.dark .stat-badge,html.dark .impact,html.dark .mini-stats>div,html.dark .pick-item,html.dark .more-item{background:#232a1d;}
html.dark .pick-item.on{background:var(--green-soft);}
html.dark .today-banner{background:#233d2d;}
html.dark .hero-header,html.dark .topbar{background:linear-gradient(135deg,#1f3d2b,#152619);}
html.dark .crest,html.dark .hh-content .crest{background:#f4f0e6 !important;}
html.dark .profile-head{background:linear-gradient(135deg,#1c2118,#232a1d);}
html.dark .highlight-card{background:linear-gradient(135deg,#1c2118,#332e1c);}
html.dark input,html.dark select,html.dark textarea{background:#161b12; color:var(--ink); border-color:var(--line-strong);}
html.dark .btn-secondary{background:#232a1d; color:var(--ink);}
html.dark .btn-danger{background:#2a1c1b; border-color:#4a2a28;}
html.dark .modal-card,html.dark .more-sheet{background:#1c2118;}
html.dark .qr-box{background:#fff;}
html.dark [style*="background:#fafbfc"],html.dark [style*="background:#faf9f4"]{background:#232a1d !important;}
html.dark [style*="background:#f0f2f5"],html.dark [style*="background:#f4f5f7"]{background:#2a3223 !important;}
html.dark .checklist,html.dark .pick-grid{background:transparent;}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:'Tajawal',sans-serif;
  background:var(--bg);
  color:var(--ink);
  min-height:100vh;
  padding:20px 18px 60px;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Cairo',sans-serif; font-weight:800; letter-spacing:-.01em;}
.hidden{display:none !important;}
.wrap{max-width:1080px; margin:0 auto;}

/* ---- crest / topbar ---- */
.crest{
  width:100px; height:100px; border-radius:24px;
  background:rgba(255,255,255,.96);
  display:flex; align-items:center; justify-content:center;
  margin:0 auto 14px;
  border:none;
  box-shadow:0 6px 18px rgba(0,0,0,.15);
  overflow:hidden;
}
.crest img{width:80%; height:80%; object-fit:contain;}
.topbar{
  position:relative; text-align:center; padding:26px 16px 24px;
  margin-bottom:22px; border-radius:24px; overflow:hidden;
  background:linear-gradient(135deg,#2f5d3f,#22452f);
  box-shadow:var(--shadow-lift);
}
.topbar > *{position:relative;}
.topbar h1{font-size:25px; color:#fff;}
.topbar .sub{color:var(--gold-light); font-size:14px; margin-top:6px; font-weight:700;}
.topbar .sub-en{color:rgba(255,255,255,.6); font-size:10.5px; margin-top:3px; letter-spacing:2px; text-transform:uppercase; font-family:'Cairo',sans-serif; font-weight:600;}
.topbar .btn-ghost{border-color:rgba(255,255,255,.4); color:#fff;}
.topbar .btn-ghost:hover{background:rgba(255,255,255,.15); color:#fff;}

/* ---- card (was .patch) ---- */
.patch{
  background:var(--surface);
  border-radius:16px;
  border:1px solid var(--line);
  padding:16px;
  box-shadow:var(--shadow);
  margin-bottom:14px;
}
.patch > h2{
  font-size:15px; color:var(--ink); margin-bottom:12px; font-weight:800;
  display:flex; align-items:center; gap:8px;
}

/* ---- buttons ---- */
button{
  font-family:'Tajawal',sans-serif; font-weight:700; cursor:pointer;
  border:none; border-radius:11px; padding:11px 18px; font-size:14px;
  transition:transform .1s ease, box-shadow .15s ease, background .15s ease, opacity .15s;
}
button:active{transform:translateY(1px);}
.btn-primary{background:var(--green); color:#fff; box-shadow:0 4px 12px rgba(47,93,63,.25);}
.btn-primary:hover{background:#a91f26;}
.btn-secondary{background:var(--surface); color:var(--ink); border:1px solid var(--line-strong);}
.btn-secondary:hover{background:#f7f8fa;}
.btn-danger{background:#fff; color:var(--danger); border:1px solid #f0c9c9;}
.btn-danger:hover{background:#fdf2f2;}
.btn-ok{background:var(--ok); color:#fff; box-shadow:0 4px 12px rgba(31,157,87,.2);}
.btn-ok:hover{background:#188049;}
.btn-ghost{background:transparent; border:1px solid var(--line-strong); color:var(--ink-soft);}
.btn-ghost:hover{background:#f7f8fa; color:var(--ink);}
.btn-ember{background:var(--gold); color:#fff;}
.btn-ember:hover{background:#a2762a;}
button:disabled{opacity:.4; cursor:not-allowed;}
.row{display:flex; gap:10px; flex-wrap:wrap;}
.row.nw{flex-wrap:nowrap; min-width:0;}
.row.nw > div:last-child{min-width:0;}

/* ---- inputs ---- */
input,select,textarea{
  font-family:'Tajawal',sans-serif;
  background:var(--surface); color:var(--ink);
  border:1px solid var(--line-strong); border-radius:11px; padding:11px 13px; font-size:14px;
  width:100%; transition:border-color .15s, box-shadow .15s;
}
input:focus,select:focus,textarea:focus{
  outline:none; border-color:var(--green);
  box-shadow:0 0 0 3px rgba(47,93,63,.12);
}
input[type=color]{padding:4px; height:44px; cursor:pointer;}
label{display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:6px; margin-top:12px; font-weight:600;}
.field{margin-bottom:6px;}

/* ---- role select / login ---- */
.center-screen{max-width:440px; margin:20px auto; text-align:center;}
.role-choice{display:grid; gap:16px; margin-top:10px;}
.role-choice .patch{cursor:pointer; text-align:right; transition:transform .12s, box-shadow .18s, border-color .18s; position:relative; overflow:hidden;}
.role-choice .patch::before{content:''; position:absolute; inset-inline-start:0; top:0; bottom:0; width:5px; background:var(--crimson);}
.role-choice .patch:nth-child(2)::before{background:var(--green);}
.role-choice .patch:hover{transform:translateY(-3px); box-shadow:var(--shadow-lift); border-color:var(--line-strong);}
.role-choice .patch h2{font-size:18px;}
.err{color:var(--danger); font-size:13px; margin-top:10px; min-height:16px; font-weight:600;}

/* ---- tabs ---- */
.tabs{display:flex; gap:7px; overflow-x:auto; margin-bottom:20px; padding:5px; background:var(--surface); border:1px solid var(--line); border-radius:15px; box-shadow:var(--shadow);}
.tab-btn{
  background:transparent; color:var(--ink-soft);
  white-space:nowrap; border:none; padding:9px 15px; border-radius:10px; font-size:13.5px;
}
.tab-btn:hover{background:#f4f5f7; color:var(--ink);}
.tab-btn.active{background:var(--green); color:#fff; box-shadow:0 3px 8px rgba(47,93,63,.28);}

/* ---- stats ---- */
.stats-row{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px;}
.stat-badge{
  background:var(--surface); color:var(--ink); border-radius:14px;
  padding:16px 8px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  border:1px solid var(--line); box-shadow:var(--shadow); gap:3px;
}
.stat-badge b{font-size:24px; font-family:'Cairo',sans-serif; color:var(--green); line-height:1.1;}
.stat-badge:nth-child(2) b{color:var(--green);}
.stat-badge:nth-child(3) b{color:var(--gold);}
.stat-badge span{font-size:11px; font-weight:700; color:var(--ink-soft); text-align:center;}

/* ---- list rows ---- */
.list-row{
  display:flex; align-items:center; justify-content:space-between;
  background:#faf9f4; border:1px solid var(--line); border-radius:12px; padding:8px 10px; margin-bottom:6px;
  gap:8px; transition:background .12s;
}
.list-row:hover{background:#f4f2ea;}
.list-row .name{font-weight:700; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.pill{background:var(--green-soft); color:var(--green); border-radius:20px; padding:2px 9px; font-size:10.5px; font-weight:700; white-space:nowrap; display:inline-block; max-width:100%; overflow:hidden; text-overflow:ellipsis; vertical-align:bottom;}
.avatar{
  width:34px; height:34px; border-radius:10px; background:var(--gold-soft);
  display:flex; align-items:center; justify-content:center; font-weight:800; color:var(--gold);
  flex-shrink:0; overflow:hidden; font-family:'Cairo',sans-serif; font-size:15px;
}
.avatar img{width:100%; height:100%; object-fit:cover;}
.av-grad{width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-family:'Cairo',sans-serif;}
.rank-1{color:var(--gold); font-weight:800;} .rank-2{color:#8a94a6; font-weight:800;} .rank-3{color:#c08457; font-weight:800;}

/* ---- chips ---- */
.chip-group{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
.chip{
  background:#f4f5f7; color:var(--ink-soft); border-radius:20px;
  padding:9px 15px; font-size:13px; cursor:pointer; border:1.5px solid transparent; transition:all .12s;
}
.chip:hover{background:#eceef1;}
.chip.selected{border-color:var(--green); background:var(--green-soft); color:var(--green); font-weight:700;}
.chip-amt{
  background:#f4f5f7; color:var(--ink); border-radius:11px; padding:9px 16px;
  cursor:pointer; font-weight:800; border:1.5px solid transparent; transition:all .12s;
}
.chip-amt:hover{background:#eceef1;}
.chip-amt.selected{border-color:var(--green); background:var(--green); color:#fff;}

.checklist{max-height:230px; overflow-y:auto; background:#fafbfc; border:1px solid var(--line); border-radius:var(--radius-sm); padding:8px;}
.select-bar{display:flex; justify-content:space-between; align-items:center; margin:12px 0 8px; flex-wrap:wrap; gap:8px;}
.pick-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:8px; max-height:320px; overflow-y:auto; padding:2px;}
.pick-item{display:flex; align-items:center; gap:8px; background:#fafbfc; border:1.5px solid var(--line); border-radius:12px; padding:8px 10px; cursor:pointer; transition:all .12s; user-select:none;}
.pick-item:hover{border-color:var(--line-strong);}
.pick-item.on{border-color:var(--green); background:var(--green-soft);}
.pick-check{width:22px; height:22px; border-radius:7px; border:1.5px solid var(--line-strong); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; flex-shrink:0; font-size:13px;}
.pick-item.on .pick-check{background:var(--green); border-color:var(--green);}
.check-item{display:flex; align-items:center; gap:9px; padding:8px 6px; font-size:14px; border-bottom:1px solid var(--line);}
.check-item:last-child{border-bottom:none;}
.check-item input[type=checkbox]{width:auto; accent-color:var(--green);}

table{width:100%; border-collapse:collapse; font-size:13px;}
th,td{padding:10px 8px; text-align:right; border-bottom:1px solid var(--line);}
th{color:var(--ink-soft); font-weight:700; font-size:12px;}

.top-search{max-width:520px; margin:0 auto 22px;}

/* dashboard layout */
.dash-grid{display:grid; grid-template-columns:2fr 1fr; gap:16px; align-items:start;}
.dash-main{min-width:0;}
.dash-side{display:flex; flex-direction:column; gap:16px;}
@media(max-width:820px){.dash-grid{grid-template-columns:1fr;}}
.rank-row{transition:background .12s, transform .1s;}
.rank-row:hover{background:var(--green-soft); transform:translateX(-2px);}
.rank-row.rank-top{background:linear-gradient(90deg, #fff, #fdf7ec);}
.rank-num{font-family:'Cairo',sans-serif; font-weight:800; font-size:16px; min-width:30px; text-align:center; color:var(--ink-soft);}
.mini-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; text-align:center;}
.mini-stats > div{background:#fafbfc; border:1px solid var(--line); border-radius:12px; padding:12px 6px;}
.mini-stats b{display:block; font-family:'Cairo',sans-serif; font-size:22px; color:var(--green);}
.mini-stats span{font-size:11px; color:var(--ink-soft); font-weight:600;}
.highlight-card{background:linear-gradient(135deg,#fff,var(--gold-soft)); border-color:#eaddbd;}
.profile-head{background:linear-gradient(135deg,#fff,#f4f6f8);}

/* hero week cards */
.hero-card{border-radius:18px; padding:16px 18px; margin-bottom:12px; color:#fff; box-shadow:var(--shadow-lift); position:relative; overflow:hidden;}
.hero-crimson{background:linear-gradient(135deg,#b8862f,#8a6320);}
.hero-green{background:linear-gradient(135deg,var(--green),var(--green-deep));}
.hero-empty{opacity:.92;}
.hero-empty .hero-sub{opacity:.95; font-size:14px;}

/* entrance animation */
@keyframes riseIn{from{opacity:0; transform:translateY(14px);}to{opacity:1; transform:translateY(0);}}
.anim-in{animation:riseIn .5s cubic-bezier(.2,.7,.3,1) both; animation-delay:calc(var(--d,0) * 70ms);}

/* podium */
.podium{display:flex; align-items:flex-end; justify-content:center; gap:5px; margin-top:8px; padding-top:8px;}
.pod{flex:1; min-width:0; max-width:34%; display:flex; flex-direction:column; align-items:center; cursor:pointer; transition:transform .15s;}
.pod:hover{transform:translateY(-3px);}
.pod-empty{visibility:hidden;}
.pod-crown{font-size:26px; line-height:1; margin-bottom:2px;}
.pod-av{width:56px !important; height:56px !important; border-radius:16px !important; font-size:20px !important; border:3px solid var(--gold-light);}
.pod-1 .pod-av{width:66px !important; height:66px !important; border:3px solid var(--gold);}
.pod-name{
  font-family:'Cairo',sans-serif; font-weight:800; font-size:12.5px;
  margin:6px 0 4px; text-align:center; line-height:1.35; width:100%;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden; word-break:break-word; min-height:2.7em;
}
.pod-stand{width:100%; border-radius:12px 12px 0 0; padding:10px 4px; text-align:center; color:#fff;}
.pod-1 .pod-stand{background:linear-gradient(180deg,var(--gold),#9a7020); min-height:76px;}
.pod-2 .pod-stand{background:linear-gradient(180deg,#9aa3ad,#6b7580); min-height:58px;}
.pod-3 .pod-stand{background:linear-gradient(180deg,#c08457,#96603c); min-height:44px;}
.pod-pts{font-family:'Cairo',sans-serif; font-weight:800; font-size:18px; line-height:1;}
.pod-rank{font-size:11px; font-weight:700; opacity:.9; margin-top:2px;}

/* impact grid */
.impact-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px;}
.impact{background:#faf9f4; border:1px solid var(--line); border-radius:14px; padding:14px 10px; text-align:center;}
.impact-ic{font-size:26px; line-height:1;}
.impact-lbl{font-size:11px; color:var(--ink-soft); font-weight:700; margin-top:6px;}
.impact-name{font-family:'Cairo',sans-serif; font-weight:800; font-size:15px; margin-top:2px; color:var(--green);}
.impact-sub{font-size:11px; color:var(--gold); font-weight:700; margin-top:2px;}

/* today pulse badge */
.today-badge{background:var(--green-soft); color:var(--green); font-size:11px; font-weight:800; padding:3px 8px; border-radius:20px; position:relative; white-space:nowrap;}
.today-badge::before{content:''; display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--ok); margin-inline-end:5px; vertical-align:middle; animation:pulse 2s infinite;}
.hero-body{display:flex; align-items:center; gap:14px;}
.hero-avatar{width:54px !important; height:54px !important; font-size:20px !important; border:3px solid rgba(255,255,255,.5); background:rgba(255,255,255,.2) !important; color:#fff !important;}
.hero-dot{width:48px; height:48px; border-radius:14px; border:3px solid rgba(255,255,255,.6); flex-shrink:0;}
.hero-name{font-family:'Cairo',sans-serif; font-weight:800; font-size:20px;}
.hero-sub{font-size:12px; opacity:.9; margin-top:2px;}
.hero-label{font-size:12px; font-weight:700; opacity:.9; margin-bottom:10px;}

/* bottom navigation (mobile-first) */
.bottom-nav{position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--line); display:flex; justify-content:space-around; padding:6px 4px calc(6px + env(safe-area-inset-bottom,0)); box-shadow:0 -4px 20px rgba(20,30,50,.06); z-index:50;}
.nav-item{background:transparent; border:none; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 8px; color:var(--ink-faint); flex:1; border-radius:12px;}
.nav-item.active{color:var(--green);}
.nav-ic{font-size:20px; line-height:1;}
.nav-label{font-size:11px; font-weight:700;}
.parent-shell{max-width:680px; margin:0 auto;}

/* elevated parent header */
.hero-header{position:relative; border-radius:24px; overflow:hidden; margin-bottom:6px; background:linear-gradient(135deg,#2a5c43,#1c3f2e); box-shadow:var(--shadow-lift);}
.hh-pattern{position:absolute; inset:0; opacity:.14; background-image:
  repeating-linear-gradient(45deg, rgba(255,255,255,.6) 0 1px, transparent 1px 22px),
  repeating-linear-gradient(-45deg, rgba(255,255,255,.6) 0 1px, transparent 1px 22px);}
.hh-content{position:relative; text-align:center; padding:26px 16px 22px; color:#fff;}
.hh-content .crest{width:92px; height:92px; border-radius:24px; margin-bottom:12px; background:rgba(255,255,255,.95); border:none;}
.hh-content h1{font-size:24px; color:#fff;}
.hh-sub{color:var(--gold-light); font-size:13px; margin-top:6px; font-weight:700;}
.live-badge{display:inline-flex; align-items:center; gap:7px; margin-top:14px; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.25); padding:6px 14px; border-radius:20px; font-size:12px; font-weight:700;}
.live-dot{width:8px; height:8px; border-radius:50%; background:#4ade80; box-shadow:0 0 0 0 rgba(74,222,128,.7); animation:pulse 2s infinite;}
.hh-tools{position:absolute; top:14px; left:14px; display:flex; gap:8px; z-index:2;}
.hh-tool{background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.25); color:#fff; width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; padding:0;}
.hh-tool:hover{background:rgba(255,255,255,.25);}
.tips-ticker{position:relative; margin-top:16px; overflow:hidden; background:rgba(0,0,0,.18); border-radius:0; padding:10px 0; -webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent); mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);}
.tips-track{display:inline-flex; gap:44px; white-space:nowrap; animation:ticker 60s linear infinite; padding-inline-start:44px;}
.tips-ticker:hover .tips-track{animation-play-state:paused;}
.tip{color:rgba(255,255,255,.92); font-size:13px; font-weight:600;}
.tip::before{content:'✦'; color:var(--gold-light); margin-inline-end:12px; font-size:11px;}
@keyframes ticker{from{transform:translateX(0);}to{transform:translateX(50%);}}

/* share modal */
.modal-backdrop{position:fixed; inset:0; background:rgba(20,25,18,.55); z-index:80; display:flex; align-items:center; justify-content:center; padding:20px; animation:fade .2s;}
.modal-card{background:var(--surface); border-radius:22px; padding:26px; max-width:340px; width:100%; text-align:center; box-shadow:var(--shadow-lift); animation:riseIn .3s;}
.modal-card h2{font-size:18px; margin-bottom:6px;}
.qr-box{background:#fff; padding:14px; border-radius:16px; display:inline-block; margin:16px 0;}
.qr-box img{display:block; width:180px; height:180px;}

/* ===================== HELPERS ===================== */
function totalPoints(studentId){
  return state.log.filter(l=>l.studentId===studentId && !l.golden).reduce((s,l)=>s+l.amount,0);
}

// رقم الإصدار — للتأكد من رفع أحدث نسخة
const APP_VERSION = 'v2.9';

// الشارة الوحيدة — تُمنح عند بلوغ العدد المطلوب من النقاط الذهبية
const ASHBAL_BADGE = { need:25, name:'شارة الأشبال', emoji:'🏅' };
// هل حصل الشبل على الشارة؟
function hasAshbalBadge(studentId){ return goldenPoints(studentId) >= ASHBAL_BADGE.need; }

/* ===== النقاط الذهبية ===== */
// كل (GOLD_RATE) نقطة عادية = نقطة ذهبية واحدة
const GOLD_RATE = 50;
// الذهبية المحسوبة تلقائيًا من النقاط العادية
function autoGolden(studentId){
  return Math.max(0, Math.floor(totalPoints(studentId) / GOLD_RATE));
}
// الذهبية الممنوحة يدويًا من القائد
function manualGolden(studentId){
  return state.log.filter(l=>l.studentId===studentId && l.golden).reduce((s,l)=>s+l.amount,0);
}
// إجمالي الذهبية
function goldenPoints(studentId){
  return autoGolden(studentId) + manualGolden(studentId);
}
// التقدّم نحو النقطة الذهبية التالية
function goldenProgress(studentId){
  const t = totalPoints(studentId);
  const inCycle = ((t % GOLD_RATE) + GOLD_RATE) % GOLD_RATE;
  return { current: inCycle, need: GOLD_RATE, pct: Math.round(inCycle / GOLD_RATE * 100) };
}
function weekPoints(studentId){
  return state.log.filter(l=>l.studentId===studentId && l.week===state.week && !l.golden).reduce((s,l)=>s+l.amount,0);
}
function patrolTotal(patrolId){
  return state.students.filter(s=>s.patrolId===patrolId).reduce((s,st)=>s+totalPoints(st.id),0);
}
// مجموع النقاط الذهبية لأفراد الطليعة
function patrolGolden(patrolId){
  return state.students.filter(s=>s.patrolId===patrolId).reduce((s,st)=>s+goldenPoints(st.id),0);
}
// عدد أفراد الطليعة الحاصلين على شارة الأشبال
function patrolBadgeCount(patrolId){
  return state.students.filter(s=>s.patrolId===patrolId && hasAshbalBadge(s.id)).length;
}
function patrolWeek(patrolId){
  return state.students.filter(s=>s.patrolId===patrolId).reduce((s,st)=>s+weekPoints(st.id),0);
}
function patrolName(id){ const pr=state.patrols.find(x=>x.id===id); return pr?pr.name:"—"; }
function studentName(id){ const s=state.students.find(x=>x.id===id); return s?s.name:"—"; }

/* ===================== RENDER ROOT ===================== */
function render(){
  const app = document.getElementById('app');
  if(!FIREBASE_READY){ app.innerHTML = setupNeededView(); return; }
  if(!dbReady){ app.innerHTML = loadingView(); return; }

  // 1) لسا ما اختار الدور (قائد/أهالي)
  if(!session.role){
    app.innerHTML = roleSelectView();
    wireEvents(); return;
  }
  // 2) دور القائد: لازم تسجيل دخول أولاً
  if(session.role==='admin' && !session.isAdmin){
    app.innerHTML = loginView();
    wireEvents(); return;
  }
  // 3) لسا ما اختار الفرقة
  if(!currentTeam){
    app.innerHTML = teamSelectView();
    wireEvents(); return;
  }
  // 4) البيانات لسا ما جهزت
  if(!synced){ app.innerHTML = loadingView(); return; }
  // 5) العرض النهائي
  if(session.role==='admin'){
    app.innerHTML = adminShell();
  } else {
    app.innerHTML = parentView();
  }
  wireEvents();
}

function avatarContent(s){
  if(s && s.photo) return `<img src="${s.photo}">`;
  const name = (s && s.name)? s.name : '?';
  const letter = name[0]||'?';
  // تدرّج لوني ثابت مشتق من الاسم (احترافي بدل لون واحد)
  const grads = [
    ['#2f5d3f','#4a8f63'], ['#b8862f','#d4a94a'], ['#a8302f','#d05a58'],
    ['#3a6ea5','#5a8fc4'], ['#6b4c8a','#9370b8'], ['#2b7a78','#3fa39f'],
    ['#c05a2f','#e0854a'], ['#4a5d3f','#6b8060']
  ];
  let h=0; for(let i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))>>>0;
  const g = grads[h % grads.length];
  return `<span class="av-grad" style="background:linear-gradient(135deg,${g[0]},${g[1]});">${letter}</span>`;
}

/* ===================== BADGES (شارات الأشبال) ===================== */
let badgeForm = { name:'', icon:'🎖️', color:'#c1272d', reqs:[] };
let selectedBadge = null; // badge id being tracked

// عدد المتطلبات التي حققها الشبل في شارة معينة
function studentBadgeCount(badge, studentId){
  const prog = (badge.progress && badge.progress[studentId]) || [];
  return prog.length;
}
function studentHasBadge(badge, studentId){
  return badge.requirements && badge.requirements.length>0 &&
    studentBadgeCount(badge, studentId) >= badge.requirements.length;
}
function badgeIconStyle(color){
  return `width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:26px;background:${color}22;border:2px solid ${color};flex-shrink:0;`;
}

function renderBadges(){
  if(selectedBadge){

    if(badge) return renderBadgeTracking(badge);

  return `

    <div class="small-note">أنشئ شارات بمتطلبات، وتابع تقدّم كل شبل نحو إتمامها.</div>

        return `<div class="list-row" style="cursor:pointer;" data-action="openBadge" data-id="${b.id}">

          <button class="btn-danger" data-action="removeBadge" data-id="${b.id}">حذف</button>
        </div>`;
      }).join('')}

    ${badgeForm.reqs.length? `<div style="margin-top:8px;">
      ${badgeForm.reqs.map((r,i)=>`<div class="list-row"><div>${i+1}. ${r}</div><button class="btn-danger" data-action="removeReq" data-idx="${i}">✖</button></div>`).join('')}

function renderBadgeTracking(badge){
  const reqs = badge.requirements || [];
  return `
  <div class="patch">
    <div class="row" style="justify-content:space-between; align-items:center;">
      <div class="row" style="align-items:center;">
        <div style="${badgeIconStyle(badge.color)}">${badge.icon}</div>
        <h2 style="margin:0;">${badge.name}</h2>
      </div>
      <button class="btn-ghost" data-action="closeBadge">↩ رجوع للشارات</button>
    </div>
    <div class="small-note" style="margin-top:8px;">أشّر على المتطلبات التي حقّقها كل شبل. عند اكتمال جميع المتطلبات تُمنح الشارة تلقائياً.</div>
    <div class="small-note" style="margin-top:6px;">المتطلبات: ${reqs.map((r,i)=>`${i+1}) ${r}`).join(' — ') || 'لا يوجد متطلبات لهذه الشارة'}</div>
  </div>

  ${state.students.length? state.students.map(s=>{
    const prog = (badge.progress && badge.progress[s.id]) || [];
    const done = prog.length, total = reqs.length;
    const pct = total? Math.round(done/total*100) : 0;
    const complete = total>0 && done>=total;
    return `

// نقاط اليوم لشبل (لعرض "+X اليوم" والنبض)
function todayPoints(studentId){
  const start = new Date(); start.setHours(0,0,0,0); const t=start.getTime();
  return state.log.filter(l=>l.studentId===studentId && l.date>=t).reduce((s,l)=>s+l.amount,0);
}
// معرّفات أصحاب المراكز الثلاثة الأولى — لاستثنائهم من بطاقات "الأثر"
function topThreeIds(){
  return [...state.students]
    .sort((a,b)=>totalPoints(b.id)-totalPoints(a.id))
    .slice(0,3)
    .map(s=>s.id);
}
// الأسرع تقدّماً هذا الأسبوع (من خارج المراكز الثلاثة الأولى)
function fastestRiser(){
  const top = topThreeIds();
  let best=null, bestV=0;
  state.students.forEach(s=>{
    if(top.includes(s.id)) return;
    const v=weekPoints(s.id); if(v>bestV){bestV=v; best=s;}
  });
  return best? {student:best, val:bestV} : null;
}
// الأكثر في فئة معيّنة (من خارج المراكز الثلاثة الأولى ومن غير المستخدمين سابقاً)
function mostInCategory(keyword, exclude){
  const skip = topThreeIds().concat(exclude||[]);
  const tally={};
  state.log.forEach(l=>{
    if(skip.includes(l.studentId)) return;
    if(l.amount>0 && l.categoryLabel && l.categoryLabel.includes(keyword)) tally[l.studentId]=(tally[l.studentId]||0)+l.amount;
  });
  let best=null,bestV=0; Object.entries(tally).forEach(([id,v])=>{ if(v>bestV){bestV=v;best=id;} });
  return best? state.students.find(s=>s.id===best) : null;
}

// رسم بياني بسيط SVG لتطوّر النقاط
function sparkline(series, s){
  const w=600, h=160, pad=30;
  const maxV = Math.max(...series.map(p=>p.v), 1);
  const minV = Math.min(...series.map(p=>p.v), 0);
  const range = (maxV-minV)||1;
  const stepX = series.length>1? (w-pad*2)/(series.length-1) : 0;
  const pts = series.map((p,i)=>{
    const x = pad + i*stepX;
    const y = h-pad - ((p.v-minV)/range)*(h-pad*2);
    return {x,y,...p};
  });
  const line = pts.map((p,i)=>`${i===0?'M':'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const area = `${line} L${pts[pts.length-1].x.toFixed(1)},${h-pad} L${pts[0].x.toFixed(1)},${h-pad} Z`;
  return `
  <svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto; overflow:visible;">
    <defs><linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--green)" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="var(--green)" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#grad)"/>
    <path d="${line}" fill="none" stroke="var(--green)" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="#fff" stroke="var(--green)" stroke-width="2"/>
      <text x="${p.x.toFixed(1)}" y="${(p.y-12).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${p.v}</text>
      <text x="${p.x.toFixed(1)}" y="${h-8}" text-anchor="middle" font-size="11" fill="var(--ink-soft)">أ${p.w}</text>`).join('')}
  </svg>`;
}

function toast(msg){
  let t = document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t); }
  t.textContent = msg; t.className='show';
  clearTimeout(t._h); t._h=setTimeout(()=>{ t.className=''; }, 2200);
}
// رذاذ احتفال
function confetti(){
  let c = document.getElementById('confetti');
  if(!c){ c=document.createElement('canvas'); c.id='confetti'; document.body.appendChild(c); }
  const ctx=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight;
  const colors=['#b8862f','#2f5d3f','#a8302f','#d4a94a','#4a8f63'];
  const pieces=Array.from({length:120},()=>({x:Math.random()*c.width, y:-20-Math.random()*c.height*0.3, r:4+Math.random()*5, col:colors[Math.floor(Math.random()*colors.length)], vy:2+Math.random()*4, vx:-2+Math.random()*4, rot:Math.random()*6, vr:-.2+Math.random()*.4}));
  let frames=0;
  (function draw(){
    ctx.clearRect(0,0,c.width,c.height); frames++;
    pieces.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.col; ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6); ctx.restore(); });
    if(frames<160) requestAnimationFrame(draw); else ctx.clearRect(0,0,c.width,c.height);
  })();
}

// عنصر حلقة تقدّم دائرية حول محتوى
function progressRing(pct, size, inner){
  const r=(size-8)/2, circ=2*Math.PI*r, off=circ*(1-pct/100);
  return `<div class="ring-wrap" style="--rs:${size}px;">
    <svg width="${size}" height="${size}"><circle class="ring-bg" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="4"/><circle class="ring-fg" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="4" stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg>
    ${inner}
  </div>`;
}

function animateCounts(){
  document.querySelectorAll('.count').forEach(el=>{
    if(el.dataset.done) return;
    const to = parseInt(el.getAttribute('data-to'))||0;
    el.dataset.done='1';
    if(to<=0){ el.textContent='0'; return; }
    const dur=700, start=performance.now();
    function tick(now){
      const t=Math.min((now-start)/dur,1);
      const eased=1-Math.pow(1-t,3);
      el.textContent = Math.round(to*eased);
      if(t<1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
}

// يصغّر الصورة ويحوّلها base64 مربّعة لتناسب حد حجم قاعدة البيانات
// ضغط صورة مع الحفاظ على أبعادها (للمعرض)
function compressPhoto(file, maxDim){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
        else if(h >= w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function compressImage(file, size){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        const min = Math.min(img.width, img.height);
        const sx = (img.width-min)/2, sy = (img.height-min)/2;
        ctx.drawImage(img, sx, sy, min, min, 0, 0, size, size);
        resolve(canvas.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// يسجّل حدثاً في سجل النشاطات (يحتفظ بآخر 50 فقط)
async function logActivity(text){
  if(!db) return;
  try{
    await db.collection(col('activity')).add({ text, date: Date.now() });
    const snap = await db.collection(col('activity')).orderBy('date','desc').get();
    if(snap.size>50){
      const batch = db.batch();
      snap.docs.slice(50).forEach(d=>batch.delete(d.ref));
      await batch.commit();
    }
  }catch(e){ console.error('activity', e); }
}

  downloadAttendance: ()=>{
    const key='m'+attMeeting;
    const present = attendancePending? [...attendancePending] : (state.attendance[key]||[]);
    const rows = present.map(id=>state.students.find(s=>s.id===id)).filter(Boolean)
      .sort((a,b)=>a.name.localeCompare(b.name,'ar'));
    const today = new Date().toLocaleDateString('ar-EG',{weekday:'long', year:'numeric', month:'long', day:'numeric'});
    const html = `<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8">
    <title>كشف حضور اللقاء ${attMeeting}</title>
    <style>
      body{font-family:'Tajawal',Arial,sans-serif; padding:30px; color:#1a1a1a;}
      h1{text-align:center; color:#2f5d3f; margin-bottom:4px;}
      .sub{text-align:center; color:#666; margin-bottom:20px; font-size:14px;}
      table{width:100%; border-collapse:collapse; margin-top:16px;}
      th,td{border:1px solid #ccc; padding:10px 12px; text-align:right; font-size:14px;}
      th{background:#2f5d3f; color:#fff;}
      tr:nth-child(even){background:#f4f6f4;}
      .count{margin-top:18px; font-weight:bold; font-size:16px; color:#2f5d3f;}
      @media print{ button{display:none;} }
    </style></head><body>
      <h1>كشف حضور — ${teamName(currentTeam)}</h1>
      <div class="sub">اللقاء ${attMeeting} · ${today}</div>
      <table>
        <tr><th>#</th><th>الاسم</th><th>رقم ولي الأمر</th><th>مكان السكن</th></tr>
        ${rows.map((s,i)=>`<tr><td>${i+1}</td><td>${s.name}</td><td style="direction:ltr;text-align:right;">${s.phone||'—'}</td><td>${s.address||'—'}</td></tr>`).join('')}
      </table>
      <div class="count">إجمالي الحاضرين: ${rows.length} شبل</div>
      <button onclick="window.print()" style="margin-top:20px;padding:10px 20px;background:#2f5d3f;color:#fff;border:none;border-radius:8px;cursor:pointer;">🖨️ طباعة</button>
    </body></html>`;
    const blob = new Blob([html], {type:'text/html;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `حضور-اللقاء-${attMeeting}.html`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    toast('تم تنزيل كشف الحضور ✓');
  },

async function handleImportFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!confirm('هذا رح يستبدل كل البيانات الحالية بقاعدة البيانات المباشرة بالنسخة المستوردة. متأكد؟')) return;
      const batch = db.batch();
      for(const col of ['patrols','categories','students','log','badges','challenges','activity','library','gallery']){
        const snap = await db.collection(col).get();
        snap.forEach(d=>batch.delete(d.ref));
      }
      await batch.commit();
      const batch2 = db.batch();
      (data.patrols||[]).forEach(x=>{ const {id,...rest}=x; batch2.set(db.collection(col('patrols')).doc(), rest); });
      (data.categories||[]).forEach(x=>{ const {id,...rest}=x; batch2.set(db.collection(col('categories')).doc(), rest); });
      (data.students||[]).forEach(x=>{ const {id,...rest}=x; batch2.set(db.collection(col('students')).doc(), rest); });
      (data.log||[]).forEach(x=>{ const {id,...rest}=x; batch2.set(db.collection(col('log')).doc(), rest); });
      (data.badges||[]).forEach(x=>{ const {id,...rest}=x; batch2.set(db.collection(col('badges')).doc(), rest); });
      (data.challenges||[]).forEach(x=>{ const {id,...rest}=x; batch2.set(db.collection(col('challenges')).doc(), rest); });
      (data.library||[]).forEach(x=>{ const {id,...rest}=x; batch2.set(db.collection(col('library')).doc(), rest); });
      (data.gallery||[]).forEach(x=>{ const {id,...rest}=x; batch2.set(db.collection(col('gallery')).doc(), rest); });
      await batch2.commit();
      await db.collection('meta').doc(currentTeam).set({ troopName:data.troopName, week:data.week||1, scoutOfWeek:data.scoutOfWeek||null, rulesText:data.rulesText||"", pointsGuide:data.pointsGuide||[] }, { merge:true });
      toast('تم استيراد النسخة بنجاح ✓');
    }catch(err){ console.error(err); alert('ملف غير صالح أو حدث خطأ بالاستيراد'); }
  };
  reader.readAsText(file);
}

async function applyIndividual(sign){
  const studentId = document.getElementById('pf_student').value;
  if(!studentId) return alert('اختر شبلاً');
  if(!pointsForm.categoryId) return alert('اختر فئة النشاط');
  const cat = state.categories.find(c=>c.id===pointsForm.categoryId);
  const noteEl = document.getElementById('pf_note');
  const note = noteEl? noteEl.value.trim() : '';
  const amount = sign*pointsForm.amount;
  await db.collection(col('log')).add({ studentId, categoryLabel:`${cat.icon} ${cat.label}`, amount, note, week: state.week, date: Date.now() });
  const s = state.students.find(x=>x.id===studentId);
  logActivity(`${s?s.name:'شبل'} ${amount>=0?'حصل على':'خُصم منه'} ${Math.abs(amount)} نقطة (${cat.label})`);
}
async function applyBulk(sign){
  if(!pointsForm.categoryId) return alert('اختر فئة النشاط');
  if(pointsForm.selectedStudents.size===0) return alert('حدد أشبال على الأقل');
  const cat = state.categories.find(c=>c.id===pointsForm.categoryId);
  const batch = db.batch();
  pointsForm.selectedStudents.forEach(id=>{
    batch.set(db.collection(col('log')).doc(), { studentId:id, categoryLabel:`${cat.icon} ${cat.label}`, amount: sign*pointsForm.amount, week: state.week, date: Date.now() });
  });
  await batch.commit();
  logActivity(`تم منح ${pointsForm.selectedStudents.size} أشبال ${sign*pointsForm.amount} نقطة (${cat.label})`);
  pointsForm.selectedStudents.clear();
  render();
}
async function applyPatrolBulk(sign){
  const patrolId = document.getElementById('pf_bulkPatrol').value;
  if(!patrolId) return alert('اختر الطليعة');
  const members = state.students.filter(s=>s.patrolId===patrolId);
  if(members.length===0) return alert('هذه الطليعة لا يوجد فيها أعضاء');
  const batch = db.batch();
  members.forEach(s=>{
    batch.set(db.collection(col('log')).doc(), { studentId:s.id, categoryLabel:'🏅 نقاط طليعة', amount: sign*pointsForm.bulkAmount, week: state.week, date: Date.now() });
  });
  await batch.commit();
  logActivity(`${patrolName(patrolId)} ${sign>=0?'حصلت على':'خُصم منها'} ${Math.abs(sign*pointsForm.bulkAmount)} نقطة`);
}

/* ===================== FIREBASE SYNC ===================== */
async function seedDefaultsIfEmpty(){
  const patrolsSnap = await db.collection(col('patrols')).get();
  if(patrolsSnap.empty){
    const batch = db.batch();
    DEFAULT_PATROLS.forEach(x=>batch.set(db.collection(col('patrols')).doc(), x));
    await batch.commit();
  }
  const catsSnap = await db.collection(col('categories')).get();
  if(catsSnap.empty){
    const batch = db.batch();
    DEFAULT_CATEGORIES.forEach(x=>batch.set(db.collection(col('categories')).doc(), x));
    await batch.commit();
  }
  const metaSnap = await db.collection('meta').doc(currentTeam).get();
  if(!metaSnap.exists){
    await db.collection('meta').doc(currentTeam).set({ troopName: teamName(currentTeam), week: 1, scoutOfWeek: null });
  }
}

function listenCollection(name, targetKey){
  return db.collection(col(name)).onSnapshot(snap=>{
    state[targetKey] = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    render();
  }, err=>console.error(name, err));
}

let dbReady = false;
async function initFirebase(){
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  // حسابات القادة مشتركة بين الفرق — تُهيَّأ مرة واحدة
  try{
    const snap = await db.collection('leaders').get();
    if(snap.empty){
      const batch = db.batch();
      DEFAULT_LEADERS.forEach(l=>batch.set(db.collection('leaders').doc(), l));
      await batch.commit();
    }
  }catch(e){ console.error('leaders seed', e); }
  db.collection('leaders').onSnapshot(snap=>{
    state.leaders = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    render();
  }, err=>console.error('leaders', err));

  render();
}

// نقل البيانات القديمة (غير المصنّفة) إلى فرقة الأشبال — مرة واحدة فقط
async function migrateLegacyToAshbal(){
  const flag = await db.collection('meta').doc('migration').get();
  if(flag.exists && flag.data().ashbalDone) return;
  const cols = ['students','log','patrols','categories','badges','challenges','activity','library','gallery','weekArchive'];
  let moved = 0;
  for(const c of cols){
    const oldSnap = await db.collection(c).get();
    if(oldSnap.empty) continue;
    // انسخ فقط إذا كانت الوجهة فاضية (تفادي التكرار)
    const destSnap = await db.collection('ashbal_'+c).limit(1).get();
    if(!destSnap.empty) continue;
    let batch = db.batch(); let n=0;
    for(const d of oldSnap.docs){
      batch.set(db.collection('ashbal_'+c).doc(d.id), d.data()); n++; moved++;
      if(n>=400){ await batch.commit(); batch=db.batch(); n=0; }
    }
    if(n>0) await batch.commit();
  }
  // انقل بيانات الأسبوع والإعدادات
  const oldMeta = await db.collection('meta').doc('app').get();
  if(oldMeta.exists){
    const destMeta = await db.collection('meta').doc('ashbal').get();
    if(!destMeta.exists) await db.collection('meta').doc('ashbal').set(oldMeta.data());
  }
  // نقل الحضور
  const oldAtt = await db.collection('attendance').get();
  if(!oldAtt.empty){
    const destAtt = await db.collection('ashbal_attendance').limit(1).get();
    if(destAtt.empty){ const b=db.batch(); oldAtt.docs.forEach(d=>b.set(db.collection('ashbal_attendance').doc(d.id), d.data())); await b.commit(); }
  }
  await db.collection('meta').doc('migration').set({ ashbalDone:true, movedAt:Date.now() });
  if(moved>0) console.log('migrated legacy → ashbal:', moved);
}

// تُستدعى بعد اختيار الفرقة — تبدأ الاستماع لبيانات تلك الفرقة
async function loadTeam(){
  // أوقف أي مستمعين سابقين
  unsubs.forEach(u=>{ try{u();}catch(e){} });
  unsubs = [];
  // أعد ضبط الحالة للفرقة الجديدة
  state.attendance = {};
  if(currentTeam==='ashbal'){ try{ await migrateLegacyToAshbal(); }catch(e){ console.error('migration', e); } }
  await seedDefaultsIfEmpty();

  unsubs.push(listenCollection('patrols','patrols'));
  unsubs.push(listenCollection('categories','categories'));
  unsubs.push(listenCollection('students','students'));
  unsubs.push(listenCollection('log','log'));
  unsubs.push(listenCollection('weekArchive','weekArchive'));
  unsubs.push(listenCollection('badges','badges'));
  unsubs.push(listenCollection('challenges','challenges'));
  unsubs.push(listenCollection('activity','activity'));
  unsubs.push(listenCollection('library','library'));
  unsubs.push(listenCollection('gallery','gallery'));
  unsubs.push(db.collection(col('attendance')).onSnapshot(snap=>{
    const map={}; snap.docs.forEach(d=>{ map[d.id]=d.data().present||[]; });
    state.attendance = map; render();
  }, err=>console.error('attendance', err)));

  unsubs.push(db.collection('meta').doc(currentTeam).onSnapshot(doc=>{
    const data = doc.data() || {};
    state.troopName = data.troopName || teamName(currentTeam);
    state.week = data.week || 1;
    state.scoutOfWeek = data.scoutOfWeek || null;
    state.rulesText = (data.rulesText && data.rulesText.trim()) ? data.rulesText : DEFAULT_RULES;
    state.pointsGuide = (data.pointsGuide && data.pointsGuide.length) ? data.pointsGuide : DEFAULT_POINTS_GUIDE;
    synced = true;
    render();
  }, err=>console.error('meta', err)));
}

// نضيف حالة وهمية للتاريخ، وعند الضغط على "رجوع" نتراجع خطوة واحدة داخل التطبيق
function pushHistoryState(){
  try{ history.pushState({app:true, t:Date.now()}, ''); }catch(e){}
}
// هل يوجد شيء يمكن الرجوع عنه داخل الموقع؟
function canGoBackInApp(){
  return !!(tourOpen || photoLightbox || shareOpen || parentMoreOpen || drawerOpen
    || viewingStudent || viewingPatrol || adminViewingStudent
    || (session.role==='parent' && parentTab!=='overview')
    || (session.role==='admin' && session.isAdmin && session.tab!=='home')
    || currentTeam || session.role);
}
// تنفيذ خطوة رجوع واحدة داخل الموقع (بالأولوية: النوافذ ثم الصفحات ثم الدور)
function goBackInApp(){
  if(tourOpen){ tourOpen=false; tourStep=0; markTourSeen(); render(); return; }
  if(photoLightbox){ photoLightbox=null; render(); return; }
  if(shareOpen){ shareOpen=false; render(); return; }
  if(parentMoreOpen){ parentMoreOpen=false; render(); return; }
  if(drawerOpen){ drawerOpen=false; render(); return; }
  if(viewingStudent){ viewingStudent=null; render(); return; }
  if(viewingPatrol){ viewingPatrol=null; render(); return; }
  if(adminViewingStudent){ adminViewingStudent=null; render(); return; }
  if(session.role==='parent' && parentTab!=='overview'){ parentTab='overview'; render(); return; }
  if(session.role==='admin' && session.isAdmin && session.tab!=='home'){ session.tab='home'; render(); return; }
  if(currentTeam){ currentTeam=null; synced=false; unsubs.forEach(u=>{try{u();}catch(e){}}); unsubs=[]; render(); return; }
  if(session.role){ session.role=null; session.isAdmin=false; render(); return; }
}
window.addEventListener('popstate', ()=>{
  if(canGoBackInApp()){
    goBackInApp();
    pushHistoryState(); // أعد وضع حالة حتى يبقى زر الرجوع فعّالًا
  }
  // إن لم يكن هناك ما نرجع عنه، نترك المتصفح يخرج طبيعيًا
});
// حالة أولية عند فتح الموقع
pushHistoryState();

// السحب للتحديث (Pull to refresh)
(function(){
  let startY=0, pulling=false;
  const ind=document.createElement('div'); ind.id='ptr'; ind.textContent='↻'; document.body.appendChild(ind);
  window.addEventListener('touchstart',e=>{ if(window.scrollY<=0){ startY=e.touches[0].clientY; pulling=true; } },{passive:true});
  window.addEventListener('touchmove',e=>{
    if(!pulling) return;
    const dy=e.touches[0].clientY-startY;
    if(dy>0 && window.scrollY<=0){ const d=Math.min(dy,90); ind.style.top=(d-50)+'px'; ind.style.opacity=Math.min(d/70,1); if(d>=70) ind.classList.add('ready'); else ind.classList.remove('ready'); }
  },{passive:true});
  window.addEventListener('touchend',()=>{
    if(!pulling) return; pulling=false;
    if(ind.classList.contains('ready')){ ind.classList.add('spin'); render(); setTimeout(()=>{ ind.classList.remove('spin','ready'); ind.style.top='-50px'; ind.style.opacity='0'; toast('تم التحديث ✓'); },500); }
    else { ind.style.top='-50px'; ind.style.opacity='0'; }
  });
})();

if(FIREBASE_READY){ initFirebase(); }
render();
